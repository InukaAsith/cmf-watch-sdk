[workspace]
resolver = "3"
members = ["cmf-wp2-app", "examples/hello", "examples/vibration-lab", "examples/motor-hog", "examples/motor-hold", "examples/agent-glow", "examples/api-demo", "examples/herdr-agents"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
