[project]
name = "wp2apps"
version = "0.1.0"
description = "Installable apps for the CMF Watch Pro 2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "cmf-watch-utils",
  "cmf-watch-fwkit",
]

[project.scripts]
wp2apps = "wp2apps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wp2apps"]

[tool.uv.sources]
cmf-watch-utils = { git = "https://github.com/arnav-kr/cmf-watch-utils", rev = "e67d88a87d61c2a65f1d4c024853ef9623b3ff05" }
cmf-watch-fwkit = { git = "https://github.com/arnav-kr/cmf-watch-utils", rev = "e67d88a87d61c2a65f1d4c024853ef9623b3ff05", subdirectory = "tooling" }
