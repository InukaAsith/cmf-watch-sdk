[project]
name = "wp2apps"
version = "0.1.0"
description = "Installable apps for the CMF Watch Pro 2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "cmf-watch-utils",
  "cmf-watch-fwkit",
  "pycryptodome>=3.20",
  "bleak>=3.1.0",
]

[project.scripts]
wp2apps = "wp2apps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wp2apps"]

[tool.uv.sources]
cmf-watch-utils = { git = "https://github.com/freethinkel/cmf-watch-utils", rev = "0f768dc371dbb15a09ec34c4189e128c83f22e74" }
cmf-watch-fwkit = { git = "https://github.com/freethinkel/cmf-watch-utils", rev = "0f768dc371dbb15a09ec34c4189e128c83f22e74", subdirectory = "tooling" }
