# XcodeGen: nix-shell -p xcodegen --run 'cd ios && xcodegen' (Workout.xcodeproj is generated, not committed)
name: Workout
options:
  developmentLanguage: ru
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    WP2_BUNDLE: local.wp2apps.workout  # scripts/ios-install overrides it (WP2_BUNDLE_ID)
packages:
  WireKit:
    path: WireKit
targets:
  Workout:
    type: application
    platform: iOS
    sources:
      - path: Workout
        excludes: [Resources/workout.wp2app, Resources/loader.wp2app]
      # built by scripts/ios-install (scripts/build-app workout), never committed
      - path: Workout/Resources/workout.wp2app
        buildPhase: resources
        optional: true
      # a one-off loader update from the phone: copied in by hand, never committed
      - path: Workout/Resources/loader.wp2app
        buildPhase: resources
        optional: true
      - path: Shared
    dependencies:
      - package: WireKit
      - target: WorkoutWidget
    info:
      path: Workout/Info.plist
      properties:
        CFBundleDisplayName: Тренировка
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Синхронизация программы и истории с часами
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Место начала тренировки, чтобы завершить её, когда вы уйдёте из зала
        NSLocationAlwaysAndWhenInUseUsageDescription: Завершить тренировку, когда вы уйдёте из зала, даже если приложение закрыто
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WP2_BUNDLE)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
  WorkoutWidget:
    type: app-extension
    platform: iOS
    sources: [WorkoutWidget, Shared]
    info:
      path: WorkoutWidget/Info.plist
      properties:
        CFBundleDisplayName: Тренировка
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WP2_BUNDLE).widget
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
