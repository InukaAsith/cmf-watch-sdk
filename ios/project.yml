# XcodeGen: nix-shell -p xcodegen --run 'cd ios && xcodegen' (Workout.xcodeproj is generated, not committed)
name: Workout
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  WireKit:
    path: WireKit
targets:
  Workout:
    type: application
    platform: iOS
    sources:
      - path: Workout
        excludes: [Resources/workout.wp2app]
      # built by scripts/ios-install (scripts/build-app workout), never committed
      - path: Workout/Resources/workout.wp2app
        buildPhase: resources
        optional: true
    dependencies:
      - package: WireKit
    info:
      path: Workout/Info.plist
      properties:
        CFBundleDisplayName: Тренировка
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Синхронизация программы и истории с часами
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.wp2apps.workout  # scripts/ios-install overrides it (WP2_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
